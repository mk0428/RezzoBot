services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rezzobot-api
    ports:
      - "8004:8000"
    volumes:
      - rezzobot-data:/data
    env_file:
      - .env
    environment:
      - EXCLUDED_IPS=98.96.223.133
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    mem_reservation: 256m
    oom_kill_disable: false

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.web
    container_name: rezzobot-web
    ports:
      - "3002:3002"
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: rezzobot-bot
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    mem_limit: 256m
    mem_reservation: 128m

  rss-bridge:
    image: rssbridge/rss-bridge:latest
    container_name: rezzobot-rss-bridge
    ports:
      - "8050:80"
    volumes:
      - ./rss-bridge-config.ini.php:/app/config.ini.php:ro
      - rss-bridge-cache:/app/cache
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m

volumes:
  rss-bridge-cache:
  rezzobot-data:
